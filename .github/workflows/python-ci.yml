name: Python CI

on:
  push:
    paths: ["PythonCode/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["PythonCode/**", ".github/workflows/python-ci.yml"]

defaults:
  run:
    working-directory: PythonCode

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov=itokawa_opt --cov-report=term-missing
