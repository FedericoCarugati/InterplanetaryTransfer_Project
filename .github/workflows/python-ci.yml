name: Python tests

on:
  push:
    paths: ["PythonCode/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["PythonCode/**", ".github/workflows/python-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonCode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest

